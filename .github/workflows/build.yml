name: build-and-push

# 推送 main / tag v* 时：构建镜像并推送到 GHCR。
#
# 镜像名固定为 ghcr.io/jushenzhidao/wechat-tools-bff
#   （与 docker-compose.server.yml / README 口径一致）
#   ⚠️ 刻意【不】用 ${{ github.repository }}：
#      本仓库名为 mpAGI-miniprogram（含大写），而 GHCR 要求镜像路径必须全小写，
#      直接引用仓库名会报：
#        invalid tag ".../mpAGI-miniprogram:sha-xxx": repository name must be lowercase
#
# 镜像 tag：
#   - sha-<commit前7位>  生产钉这个（不可变，回滚精确）
#   - latest             便于回滚/临时测试；生产服务器请用 sha-xxx
env:
  IMAGE_NAME: ghcr.io/jushenzhidao/wechat-tools-bff

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推 GHCR 必须

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # Actions 自动提供，无需自建

      - name: Short SHA (前 7 位，对齐 flovart 的 sha-xxxxxxx 写法)
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.sha.outputs.short }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
